<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SpineFlow · Catálogo</title>
<style>
:root{
  --bg:#F2EFE8;--ink:#14313A;--muted:#5F737B;--teal:#0F8B84;--deep:#0B5F5B;
  --card:#fff;--line:#E4DFD4;--coral:#E0785C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;justify-content:center;overscroll-behavior:none}
.app{width:100%;max-width:460px;height:100dvh;position:relative;overflow:hidden;margin:0 auto}@media(min-width:900px){.app{max-width:820px}}@media(min-width:1400px){.app{max-width:1100px}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  transition:transform .32s cubic-bezier(.4,0,.2,1);overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 20px)}
.screen.hide{transform:translateX(100%);pointer-events:none}

/* ========== CATÁLOGO ========== */
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--deep);margin:0 0 6px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 6px}
.sub{font-size:13.5px;color:var(--muted);margin:0 0 16px;line-height:1.45}

.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.tab{flex:0 0 auto;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);white-space:nowrap;font-family:inherit}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab .n{opacity:.6;font-weight:600;margin-left:5px}

.search{width:100%;padding:12px 15px;border-radius:12px;border:1px solid var(--line);background:#fff;
  font-size:14px;margin-bottom:14px;font-family:inherit}
.search:focus{outline:none;border-color:var(--teal)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:14px;overflow:hidden;cursor:pointer;transition:.14s;
  border:1px solid var(--line);display:flex;flex-direction:column}
.card:active{transform:scale(.97)}
.thumb{aspect-ratio:4/3;background:#EFECE4;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;display:block;background:#0a1a20}
.thumb .miss{display:flex;align-items:center;justify-content:center;height:100%;
  color:#8FA6AD;font-size:22px}
.thumb .badge{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92);
  color:var(--deep);font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:6px}
.card b{display:block;font-size:12.5px;font-weight:700;padding:9px 10px 4px;line-height:1.25}
.card span{display:block;font-size:10.5px;color:var(--muted);padding:0 10px 9px;font-weight:600}

.loading{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}

/* ========== REPRODUCTOR ========== */
#player{padding:0;background:#111C20}
.ptop{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;color:#fff}
.back{width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.back svg{width:20px;height:20px}
.ptitle{flex:1;min-width:0}
.ptitle b{display:block;font-size:15px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle span{font-size:11.5px;color:#8FA6AD}
.snd{width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.snd.off{background:rgba(255,255,255,.06);color:#67797F}
.snd svg{width:19px;height:19px}

.stage{position:relative;flex:1;margin:12px 16px;border-radius:22px;overflow:hidden;background:#0B1418;touch-action:pan-y}
.layer{position:absolute;inset:0;opacity:0;transition:opacity .6s ease}
.layer.on{opacity:1}
.layer img{width:100%;height:100%;object-fit:contain;display:block;background:#0a1a20}
.dots{position:absolute;top:12px;left:0;right:0;display:flex;gap:6px;justify-content:center;z-index:3}
.dot{width:24px;height:4px;border-radius:3px;background:rgba(255,255,255,.28)}
.dot.act{background:#fff}
.speak{position:absolute;top:12px;right:14px;z-index:3;font-size:10px;font-weight:800;letter-spacing:.1em;
  color:#0B1418;background:var(--teal);padding:4px 8px;border-radius:7px;opacity:0;transition:.2s}
.speak.on{opacity:1}

.capwrap{position:absolute;left:0;right:0;bottom:0;padding:26px 18px 18px;
  background:linear-gradient(to top,rgba(8,16,19,.96) 45%,rgba(8,16,19,0))}
.cstep{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#54C4BC;margin-bottom:5px}
.cap{font-size:17px;font-weight:600;line-height:1.32;color:#fff;margin:0;min-height:2.6em}

.meta{padding:0 16px;color:#9DB2B8;font-size:12.5px;line-height:1.5}
.meta b{color:#DCE7EA}
.pctl{display:flex;align-items:center;gap:12px;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px)}
.nav{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);
  color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.nav[disabled]{opacity:.3}
.nav svg{width:22px;height:22px}
.cnt{flex:1;text-align:center;color:#fff}
.cnt b{font-size:15px;font-weight:800}
.cnt span{display:block;font-size:11px;color:#8FA6AD;margin-top:1px}
.pause{height:52px;padding:0 20px;border-radius:26px;border:none;background:var(--teal);color:#fff;
  font-size:14.5px;font-weight:750;display:flex;align-items:center;gap:8px;cursor:pointer;flex:0 0 auto;font-family:inherit}
.pause.paused{background:var(--coral)}
.pause svg{width:16px;height:16px}
</style>
</head>
<body>
<div class="app">

  <!-- ============ CATÁLOGO ============ -->
  <div class="screen" id="home">
    <p class="eyebrow">SpineFlow · Catálogo clínico</p>
    <h1>Los 100 ejercicios</h1>
    <p class="sub">Tocá un ejercicio para verlo en loop con la guía por voz.</p>
    <input class="search" id="search" placeholder="Buscar por nombre..." autocomplete="off">
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"><div class="loading">Cargando ejercicios…</div></div>
  </div>

  <!-- ============ REPRODUCTOR ============ -->
  <div class="screen hide" id="player">
    <div class="ptop">
      <button class="back" onclick="closePlayer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="ptitle"><b id="pName">—</b><span id="pSeries">—</span></div>
      <button class="snd" id="sndBtn" onclick="toggleVoice()">
        <svg id="sndIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a3.5 3.5 0 00-2-3.15v6.3A3.5 3.5 0 0016.5 12z"/></svg>
      </button>
    </div>
    <div class="stage" id="stage">
      <div class="dots" id="dots"></div>
      <div class="speak" id="speakBadge">● GUÍA</div>
      <div class="layer" id="lA"></div>
      <div class="layer" id="lB"></div>
      <div class="capwrap">
        <div class="cstep" id="cStep">Fase 1</div>
        <p class="cap" id="cap">—</p>
      </div>
    </div>
    <div class="meta" id="meta"></div>
    <div class="pctl">
      <button class="nav" id="prev" onclick="goEx(exI-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="cnt"><b id="pos">1 / 3</b><span>deslizá para cambiar</span></div>
      <button class="nav" id="next" onclick="goEx(exI+1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="pause" id="pauseBtn" onclick="togglePlay()">
        <svg id="pIcon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <span id="pTxt">Pausar</span>
      </button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   SPINEFLOW · CATÁLOGO Y REPRODUCTOR
   Carga: data/exercises.json + data/v11-static-sequences.json
   Resuelve aliases (p6→l2, etc) y fallback V9 (media/exercises/)
   Loop crossfade + voz guiada + swipe entre ejercicios
   ============================================================ */

const MIN_MS  = 3200;   // tiempo mínimo por fase
const HOLD_MS = 2600;   // pausa después de la voz (para ejecutar)
const RATE    = 0.78;   // velocidad de voz (más lenta = rehab +60)

// Cada ejercicio pertenece a UNA categoría según su ID prefix
function categorize(id){
  if(id.startsWith('s60_')) return 'plus60';
  if(/^(c|n|dp)/.test(id)) return 'cervical';
  if(/^(g|k4|k1|k5)/.test(id)) return 'dorsal';
  if(/^(l|s|bp|em|k3|k8|cl|pub|sac|p)/.test(id)) return 'lumbar';
  return 'otros';
}
const CAT_LABEL = {all:'Todos',cervical:'Cervical',dorsal:'Dorsal',lumbar:'Lumbar',plus60:'+60'};

let EX = {};          // exercises.json
let SEQ = {};         // v11-static-sequences.json → sequences
let currentCat = 'all';
let filtered = [];

/* ---------- Carga inicial ---------- */
async function boot(){
  try {
    const [exR, seqR] = await Promise.all([
      fetch('data/exercises.json'),
      fetch('data/v11-static-sequences.json')
    ]);
    EX  = await exR.json();
    SEQ = (await seqR.json()).sequences || {};
  } catch(e){
    document.getElementById('grid').innerHTML =
      `<div class="loading" style="grid-column:1/-1">No pude cargar los datos.<br><br>
       <small style="font-size:11.5px">Este archivo tiene que subirse al repo (raíz o /app) para que funcione.<br>
       Abierto con file:// no anda por seguridad del navegador.</small></div>`;
    return;
  }
  renderTabs();
  applyFilter();
  document.getElementById('search').oninput = applyFilter;
}

/* ---------- Resolver imagen de un ejercicio ---------- */
function imagesFor(id){
  const s = SEQ[id];
  if(!s) return [`media/exercises/${id}.webp`]; // fallback V9

  // Alias: usa las imágenes de otro ejercicio
  const targetId = s.reuses || id;
  const targetSeq = s.reuses ? SEQ[s.reuses] : s;

  if(targetSeq && targetSeq.files && targetSeq.files.length){
    return targetSeq.files.map(f => `${targetSeq.folder || 'media/sequences/'+targetId+'/'}${f}`);
  }
  return [`media/exercises/${targetId}.webp`];
}

/* ---------- Categorías ---------- */
function renderTabs(){
  const counts = {all: Object.keys(EX).length};
  for(const id in EX){
    const c = categorize(id);
    counts[c] = (counts[c]||0)+1;
  }
  const cats = ['all','cervical','dorsal','lumbar','plus60'];
  document.getElementById('tabs').innerHTML = cats.map(c=>
    `<button class="tab ${c===currentCat?'on':''}" data-c="${c}">
      ${CAT_LABEL[c]}<span class="n">${counts[c]||0}</span></button>`
  ).join('');
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{ currentCat = t.dataset.c; renderTabs(); applyFilter(); };
  });
}

/* ---------- Grid ---------- */
function applyFilter(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  filtered = Object.keys(EX)
    .filter(id => currentCat==='all' || categorize(id)===currentCat)
    .filter(id => !q || (EX[id].name||'').toLowerCase().includes(q))
    .sort((a,b) => (EX[a].name||'').localeCompare(EX[b].name||''));
  renderGrid();
}

function renderGrid(){
  const grid = document.getElementById('grid');
  if(!filtered.length){
    grid.innerHTML = `<div class="loading" style="grid-column:1/-1">Sin resultados</div>`;
    return;
  }
  grid.innerHTML = filtered.map(id => {
    const ex = EX[id];
    const imgs = imagesFor(id);
    const thumb = imgs[0];
    const s = SEQ[id];
    const nPhases = s && s.files ? s.files.length : (s && s.reuses ? (SEQ[s.reuses]?.files?.length||1) : 1);
    const badge = s?.reuses ? '↻' : (s?.status === 'ready' ? '' : '');
    return `<div class="card" data-i="${filtered.indexOf(id)}">
      <div class="thumb">
        <img src="${thumb}" alt="" onerror="this.parentNode.innerHTML='<div class=miss>—</div>'">
        ${badge ? `<span class="badge">${badge}</span>` : ''}
      </div>
      <b>${ex.name || id}</b>
      <span>${id} · ${nPhases} fase${nPhases>1?'s':''}</span>
    </div>`;
  }).join('');
  document.querySelectorAll('.card').forEach(c=>{
    c.onclick=()=>openPlayer(parseInt(c.dataset.i));
  });
}

/* ============================================================
   REPRODUCTOR
   ============================================================ */
let exI=0, phI=0, useA=true, playing=false, voiceOn=true, timer=null, token=0;

function openPlayer(index){
  exI = index;
  document.getElementById('home').classList.add('hide');
  document.getElementById('player').classList.remove('hide');
  loadEx();
  play();
}
function closePlayer(){
  stop(); speechSynthesis.cancel();
  document.getElementById('player').classList.add('hide');
  document.getElementById('home').classList.remove('hide');
}

function loadEx(){
  const id = filtered[exI];
  const ex = EX[id];
  const imgs = imagesFor(id);
  ex._phases = ex._phases || imgs.map((src, i) => ({
    img: src,
    step: `Fase ${i+1}`,
    cap: ex.steps?.[i] || ex.position || ex.name || '',
    voice: ex.steps?.[i] || ex.position || ''
  }));
  document.getElementById('pName').textContent = ex.name || id;
  document.getElementById('pSeries').textContent = [ex.series, ex.reps || ex.duration].filter(Boolean).join(' · ');
  document.getElementById('pos').textContent = (exI+1)+' / '+filtered.length;
  document.getElementById('prev').disabled = exI===0;
  document.getElementById('next').disabled = exI===filtered.length-1;
  const parts = [];
  if(ex.breathing) parts.push(`<b>🫁 Respiración:</b> ${ex.breathing}`);
  if(ex.warning)   parts.push(`<b>⚠️ Cuidado:</b> ${ex.warning}`);
  document.getElementById('meta').innerHTML = parts.join('<br>');
  imgs.forEach(src=>{const i=new Image();i.src=src;}); // precarga
  phI=0; paint();
}
function paint(){
  const id = filtered[exI];
  const ph = EX[id]._phases[phI];
  const back = useA ? document.getElementById('lB') : document.getElementById('lA');
  const front= useA ? document.getElementById('lA') : document.getElementById('lB');
  back.innerHTML = `<img src="${ph.img}" alt="" onerror="this.parentNode.innerHTML='<div style=display:flex;align-items:center;justify-content:center;height:100%;color:#5B7178;font-size:13px;text-align:center;padding:30px>🖼️<br>Lámina pendiente</div>'">`;
  back.classList.add('on'); front.classList.remove('on');
  useA = !useA;
  document.getElementById('cStep').textContent = ph.step;
  document.getElementById('cap').textContent   = ph.cap;
  document.getElementById('dots').innerHTML = EX[id]._phases.map((_,i)=>
    `<div class="dot ${i===phI?'act':''}"></div>`).join('');
}
function runPhase(){
  const my = ++token;
  paint();
  const id = filtered[exI];
  const ph = EX[id]._phases[phI];
  const t0 = Date.now();
  const next = ()=>{
    if(my!==token || !playing) return;
    const wait = Math.max(HOLD_MS, MIN_MS - (Date.now()-t0));
    timer = setTimeout(()=>{
      if(my!==token || !playing) return;
      phI = (phI+1) % EX[id]._phases.length;
      runPhase();
    }, wait);
  };
  if(voiceOn && 'speechSynthesis' in window && ph.voice){
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(ph.voice);
    u.lang='es-AR'; u.rate=RATE; u.pitch=1;
    document.getElementById('speakBadge').classList.add('on');
    u.onend   = ()=>{ document.getElementById('speakBadge').classList.remove('on'); next(); };
    u.onerror = ()=>{ document.getElementById('speakBadge').classList.remove('on'); next(); };
    speechSynthesis.speak(u);
    setTimeout(()=>{ if(my===token && !speechSynthesis.speaking) next(); }, 400);
  } else next();
}
function play(){ playing=true; setUI(); runPhase(); }
function stop(){ playing=false; token++; clearTimeout(timer); speechSynthesis.cancel();
  document.getElementById('speakBadge').classList.remove('on'); setUI(); }
function togglePlay(){ playing?stop():play(); }
function setUI(){
  document.getElementById('pTxt').textContent = playing?'Pausar':'Reanudar';
  document.getElementById('pIcon').innerHTML = playing
    ? '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
    : '<path d="M7 5l12 7-12 7z"/>';
  document.getElementById('pauseBtn').classList.toggle('paused', !playing);
}
function toggleVoice(){
  voiceOn = !voiceOn;
  document.getElementById('sndBtn').classList.toggle('off', !voiceOn);
  if(!voiceOn) speechSynthesis.cancel();
  if(playing){ token++; clearTimeout(timer); runPhase(); }
}
function goEx(n){
  const t = Math.max(0, Math.min(filtered.length-1, n));
  if(t===exI) return;
  token++; clearTimeout(timer); speechSynthesis.cancel();
  exI = t; loadEx(); if(playing) runPhase();
}
/* swipe */
let sx=0, sy=0, tr=false;
const st = document.getElementById('stage');
st.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; tr=true; }, {passive:true});
st.addEventListener('touchend', e=>{
  if(!tr) return; tr=false;
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) goEx(exI + (dx<0?1:-1));
}, {passive:true});
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') goEx(exI+1);
  if(e.key==='ArrowLeft')  goEx(exI-1);
});

boot();
</script>
</body>
</html>
