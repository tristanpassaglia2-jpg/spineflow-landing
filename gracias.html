<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpineFlow — Suscripción activa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0fafa;
      color: #1a2e35;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,128,128,0.10);
      max-width: 480px;
      width: 100%;
      text-align: center;
      padding: 48px 32px;
    }
    .check {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .check svg {
      width: 40px;
      height: 40px;
      stroke: #fff;
      stroke-width: 3;
      fill: none;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0d9488;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 1.05rem;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #0d9488, #0f766e);
      color: #fff;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 16px 40px;
      border-radius: 12px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(13,148,136,0.3);
    }
    .note {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>¡Tu suscripción está activa!</h1>
    <p class="subtitle">
      Ya tenés acceso completo a SpineFlow.<br>
      Tu programa de rehabilitación personalizado te espera.
    </p>
    <a href="/app" class="btn">Entrar a SpineFlow</a>
    <p class="note">
      Si tenés alguna duda, escribinos a
      <a href="mailto:vigia24app@gmail.com" style="color:#0d9488;">vigia24app@gmail.com</a>
    </p>
  </div>
</body>
</html>
