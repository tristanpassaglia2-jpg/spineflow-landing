      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>

          <div style={{ fontSize:12, color:"#94A3B8", textTransform:"uppercase", letterSpacing:1 }}>Buenos días</div>
          <div style={{ fontFamily:"'Georgia',serif", fontSize:22, fontWeight:700, color:"#0F172A", marginTop:2 }}>SpineFlow</div>

const NavBar = ({ active, onHome, onPlan, onProgress }) => (
  <div style={{ display:"flex", borderTop:"1px solid #F1F5F9", background:"white" }}>
    {[{id:"home",icon:"🏠",label:"Inicio",fn:onHome},{id:"plan",icon:"📋",label:"Plan",fn:onPlan},{id:"progress",icon:"📊",label:"Progreso",fn:onProgress}].map(n => (
      <button key={n.id} onClick={n.fn} style={{ flex:1, padding:"12px 8px 10px", background:"none", border:"none", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:3 }}>
        <span style={{ fontSize:20 }}>{n.icon}</span>
        <span style={{ fontSize:10, color: active===n.id ? "#0EA5E9" : "#94A3B8", fontWeight: active===n.id ? 700 : 400 }}>{n.label}</span>
        {active===n.id && <div style={{ width:16, height:2, borderRadius:1, background:"#0EA5E9" }}/>}
      </button>
    ))}
  </div>
);

// ─── APP ──────────────────────────────────────────────────────────────────────

function SpineFlow() {
  const [screen, setScreen] = useState("splash");
  const [region, setRegion] = useState(null);
  const [pathology, setPathology] = useState(null);
  const [activeExId, setActiveExId] = useState(null);
  const [isPro, setIsPro] = useState(false);
  const [navActive, setNavActive] = useState("home");

  const goHome = () => { setScreen("home"); setNavActive("home"); };
  const goPlan = () => { setScreen("plan"); setNavActive("plan"); };
  const goProgress = () => { setScreen("progress"); setNavActive("progress"); };

  const startExercise = (id) => { setActiveExId(id); setScreen("exercise"); };

  const sessionList = pathology ? (isPro ? pathology.ex : pathology.ex.filter(id => isFree(pathology, id))) : [];
  const activeIdx = sessionList.indexOf(activeExId);

  const nextExercise = () => {
    if (activeIdx < sessionList.length - 1) setActiveExId(sessionList[activeIdx+1]);
    else goPlan();
  };

  return (
    <div style={{ maxWidth:390, margin:"0 auto", height:"100vh", display:"flex", flexDirection:"column", fontFamily:"'Helvetica Neue', Arial, sans-serif", background:"#F8FAFC", position:"relative", overflow:"hidden" }}>
      <style>{`* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; } @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} } button { -webkit-appearance: none; } ::-webkit-scrollbar { display: none; }`}</style>
      <div style={{ flex:1, overflowY:"auto", background:"white" }}>
        {screen === "splash" && <Splash onNext={() => setScreen("region")}/>}
        {screen === "region" && <RegionSelect onSelect={r => { setRegion(r); setScreen("pathology"); }}/>}
        {screen === "pathology" && region && <PathologySelect region={region} onSelect={p => { setPathology(p); goHome(); }} onBack={() => setScreen("region")}/>}
        {screen === "home" && pathology && <Home pathology={pathology} isPro={isPro} onChange={() => setScreen("region")} onPlan={goPlan} onProgress={goProgress} onPaywall={() => setScreen("paywall")}/>}
        {screen === "plan" && pathology && <PlanScreen pathology={pathology} isPro={isPro} onStartExercise={startExercise} onPaywall={() => setScreen("paywall")} onBack={goHome}/>}
        {screen === "exercise" && activeExId && pathology && <ExerciseSession exercise={EXERCISES[activeExId]} pathology={pathology} exerciseIndex={activeIdx < 0 ? 0 : activeIdx} totalExercises={sessionList.length} onNext={nextExercise} onBack={goPlan}/>}
        {screen === "progress" && <Progress onBack={goHome}/>}
        {screen === "paywall" && <Paywall onBack={goHome} onUnlock={() => { setIsPro(true); goHome(); }}/>}
      </div>
      {["home","plan","progress"].includes(screen) && pathology && <NavBar active={navActive} onHome={goHome} onPlan={goPlan} onProgress={goProgress}/>}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<SpineFlow />);
</script>
